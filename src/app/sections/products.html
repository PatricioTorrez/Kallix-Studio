<section class="section" id="productos">
  <div class="glow" aria-hidden="true"></div>

  <div class="container">
    <kx-section-header
      eyebrow="Productos propios"
      lede="No solo construimos para clientes: también hacemos productos propios. Dos sistemas SaaS y dos apps Android, diseñados y programados por el mismo equipo."
    >
      <h2 class="h2">Software <span class="gradient-text">de la casa</span>.</h2>
    </kx-section-header>

    <!-- Una ficha por pantalla, sin asomo de la siguiente: el asomo se probó el
         2026-09-21 y Patricio lo descartó. Reponerlo es quitar `[full]` y darle
         un valor a `--peek` en `products.css`; el carrusel lo sigue sabiendo
         hacer. El indicador son los iconos de las apps, así los cuatro se
         reconocen de un vistazo aunque solo uno esté desplegado. -->
    <kx-carousel
      class="catalog"
      label="los productos"
      [items]="products"
      [itemLabels]="productNames"
      [full]="true"
      [autoplayMs]="9000"
      kxReveal="scale"
    >
      <ng-template #slide let-product>
        <article
          class="product card card--glass"
          [style.--brand]="product.color"
          [style.--brand-on-light]="product.colorOnLight"
          [attr.data-product]="product.id"
        >
          <!-- El icono de la app, solo, sobre un fondo neutro. Sin halo, sin
               anillos y sin reflejo al puntero: el equipo pidió que se viera
               más profesional y el escenario luminoso tiraba a póster. Lo que
               queda de marca es la sombra teñida bajo la placa. -->
          <div class="stage">
            <div class="icon">
              <img
                class="app-icon"
                [src]="product.icon"
                [alt]="'Icono de ' + product.name"
                width="384"
                height="384"
                loading="lazy"
                decoding="async"
              />
            </div>
          </div>

          <div class="body">
            <div class="top">
              <h3 class="h3 name">{{ product.name }}</h3>
              <kx-badge [tone]="product.kind === 'android' ? 'amber' : 'teal'">
                {{ kindLabel(product.kind) }}
              </kx-badge>
            </div>

            <p class="tagline mono">{{ product.tagline }}</p>
            <p class="desc">{{ product.description }}</p>

            <ul class="features">
              @for (feature of product.features; track feature) {
                <li>
                  <kx-icon name="check" [size]="14" />
                  {{ feature }}
                </li>
              }
            </ul>
          </div>
        </article>
      </ng-template>

      <ng-template #thumb let-product>
        <img class="thumb" [src]="product.icon" alt="" width="384" height="384" decoding="async" />
      </ng-template>
    </kx-carousel>
  </div>
</section>
