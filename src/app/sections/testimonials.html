<section class="section" id="testimonios">
  <div class="container">
    <kx-section-header
      eyebrow="Testimonios"
      lede="Lo que dicen quienes ya trabajaron con nosotros. Sin adornos: sus palabras, su contexto."
    >
      <h2 class="h2">La opinión que <span class="gradient-text">sí cuenta</span>.</h2>
    </kx-section-header>

    <div class="carousel-wrap" kxReveal="up">
      <kx-carousel [items]="testimonials" label="Testimonios de clientes">
        <ng-template #slide let-item>
          @let quote = asTestimonial(item);

          <figure class="quote card card--glass card--lit">
            <div class="stars" aria-label="5 de 5 estrellas">
              @for (star of stars; track star) {
                <kx-icon name="star" [size]="15" />
              }
            </div>

            <blockquote>{{ quote.quote }}</blockquote>

            <figcaption>
              <span class="initials" aria-hidden="true">{{ quote.initials }}</span>
              <span class="who">
                <strong>{{ quote.author }}</strong>
                <span class="dim">{{ quote.role }} · {{ quote.company }}</span>
              </span>
            </figcaption>
          </figure>
        </ng-template>
      </kx-carousel>
    </div>
  </div>
</section>
